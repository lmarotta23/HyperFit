<link rel="stylesheet" href="Formatting.css">
<script src="Functionality.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HyperFit</title>

<!-- iOS "Add to Home Screen" behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HyperFit">
<link rel="apple-touch-icon" href="AppIcon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Formatting.css">
</head>
<body>

<div id="app-shell">

  <header id="app-header">
    <span id="header-title">HyperFit</span>
    <span id="header-date"></span>
  </header>

  <main id="app-main"><!-- rendered by Functionality.js --></main>

  <nav id="tab-bar">
    <button class="tab-btn" data-tab="baseline" aria-label="Baseline">
      <span class="tab-icon">▲</span>
      <span class="tab-label">Baseline</span>
    </button>
    <button class="tab-btn" data-tab="today" aria-label="Today">
      <span class="tab-icon">●</span>
      <span class="tab-label">Today</span>
    </button>
    <button class="tab-btn" data-tab="calendar" aria-label="Calendar">
      <span class="tab-icon">▦</span>
      <span class="tab-label">Calendar</span>
    </button>
  </nav>

</div>

<script src="Functionality.js"></script>
</body>
</html>
